<div class="am-panel col-sm-12 col-md-12 col-lg-4 mt-3 w-100">
  <h3>Tasks</h3>
  <div class="d-flex mt-3">
    <div class="d-flex w-100" style="border: 2px solid rgb(211, 211, 211); border-radius: 6px;">
      <button class="btn py-1" style="border-right: 0;"><i class="fas fa-search"></i></button>
      <input 
        type="text" 
        class="form-control form-control-sm" 
        placeholder="Search task..."
        maxlength="32"
        style="border: none;"
      >
    </div>
    <button type="button" class="default-btn ms-2 d-flex align-items-center"><i class="fa fa-filter"></i>Filter</button>
  </div>
  <div class="d-flex flex-wrap gap-2 mt-3">
    <button class="sm-btn flex-fill">All</button>
    <button class="sm-btn flex-fill">To Do</button>
    <button class="sm-btn flex-fill">In Progress</button>
    <button class="sm-btn flex-fill">Completed</button>
    <button class="sm-btn flex-fill">Overdue</button>
  </div>

  <div class="table-responsive task-table-wrapper mt-3">
    <table class="table task-table">
      <tbody>
        <tr class="task-item" *ngFor="let task of taskList?.items" (click)="selectTask(task)">
          <td class="align-middle">
            <div class="circle"></div>
          </td>
          <td>
            <div class="d-flex flex-column">
              {{ task.title }}
              <span style="font-size: 0.9rem; color: gray;">{{ task.assignee }}</span>
            </div>
          </td>
          <td>
            <div class="status-text text-nowrap">
              {{ task.status }}
            </div>
          </td>
          <td style="text-align: center;">
            {{ task.dueDate }}
          </td>
        </tr>
      </tbody>
      <tfoot>
        <tr>
          <td colspan="4" class="text-center">
            <button class="default-btn" style="padding: 5px 8px;"><i class="fa-solid fa-caret-left"></i></button>
            <span>
              <a>
                <!-- NAKA *ngFor TO -->
                1
              </a>
            </span>
            <button class="default-btn" style="padding: 5px 8px;"><i class="fa-solid fa-caret-right"></i></button>
          </td>
        </tr>
      </tfoot>
    </table>
  </div>
</div>
