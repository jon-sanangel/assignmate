<div class="am-panel col-sm-12 col-md-12 col-lg-4 mt-3 w-100">
  <div class="d-flex justify-content-between align-items-center flex-wrap">
    <h2>Task Details</h2>
    <div>
      <button class="default-btn me-2" (click)="editTask()"><i class="fa-solid fa-pencil"></i>&nbsp;Edit</button>
      <button class="default-btn"><i class="fa-solid fa-trash"></i>&nbsp;Delete</button>
    </div>
  </div>
  <ng-container *ngTemplateOutlet="taskContent"></ng-container>
</div>

<ng-template #noTask>
  <div class="text-center mt-5">
    <p>No task selected</p>
    <img src="assets/logo/paper-icon.png" alt="" class="img-fluid" style="max-width: 100%; width: 200px;">
    <p class="mt-3">Choose a task from the list<br> to see more information</p>
    
    <ng-content></ng-content>
  </div>
</ng-template>
