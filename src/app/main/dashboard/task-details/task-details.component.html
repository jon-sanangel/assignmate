<div class="am-panel col-sm-12 col-md-12 col-lg-4 mt-3 w-100">
  <div class="d-flex justify-content-between align-items-center flex-wrap">
    <h3>Task Details</h3>
    <div>
      <button class="btn btn-success me-2" (click)="editTask()"><i class="fa-solid fa-pencil"></i>&nbsp;Edit</button>
      <button class="btn btn-danger"><i class="fa-solid fa-trash"></i>&nbsp;Delete</button>
    </div>
  </div>
  <ng-container *ngIf="selectedTask$ | async as task; else noTask">
    <app-task-details-content></app-task-details-content>
  </ng-container>
</div>

<ng-template #noTask>
  <div class="text-center mt-5">
    <p>No task selected</p>
    <img src="assets/logo/paper-icon.png" alt="" class="img-fluid" style="max-width: 100%; width: 200px;">
    <p class="mt-3">Select a task to view details</p>
  </div>
</ng-template>
